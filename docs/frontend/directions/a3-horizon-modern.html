<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Направление A3, Горизонт современный: карта (S2)</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/a3.css">
</head>
<body>
<div class="viewer-bar"><a href="index.html">Все направления</a><span>A3, Горизонт современный. Плавающая навигация, крупные цифры, контраст.</span><a href="?device=phone">Только телефон</a><a href="?device=tablet">Только планшет</a></div>
<main id="stage"></main>
<script src="assets/icons.js"></script>
<script src="assets/screen.js"></script>
<script>
QS.mount({
  layers: '<image href="assets/img/sentinel2-ili.webp" x="0" y="0" width="1800" height="1800" preserveAspectRatio="none"/>',
  cam: { phone: { peek: { x: 715, y: 372, scale: 0.68 }, half: { x: 713, y: 341, scale: 0.45 } }, tablet: { x: 555, y: 375, scale: 1.15 } },
  iw: { btn: "regular", ctl: "regular", nav: "regular", navOn: "fill" },
  chev: true, noBattery: true, trail: false, clusterRadius: 9,
  attrib: 'Sentinel-2 cloudless, s2maps.eu, EOX IT Services GmbH, CC BY 4.0. Contains modified Copernicus Sentinel data 2016'
});
</script>
<script>
(function(){
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* out-of-zone cows: dark casing outside the white ring, pulse 3 cycles then a static ring (WCAG 2.2.2) */
  document.querySelectorAll("circle.dot.out").forEach(function(c){
    var k=c.cloneNode(false);k.setAttribute("class","casing");k.setAttribute("aria-hidden","true");c.parentNode.insertBefore(k,c);
    var p=c.cloneNode(false);p.setAttribute("class","pulse");p.setAttribute("aria-hidden","true");c.parentNode.insertBefore(p,k);
  });
  /* tab bar selection morph */
  document.querySelectorAll(".phone .tabs").forEach(function(t){
    var items=[].slice.call(t.querySelectorAll(".nav-i"));
    items.forEach(function(a,i){a.addEventListener("click",function(e){e.preventDefault();items.forEach(function(x){x.classList.remove("is-cur");x.removeAttribute("aria-current")});a.classList.add("is-cur");a.setAttribute("aria-current","page");t.style.setProperty("--i",i)})});
  });
})();
</script>
</body>
</html>
