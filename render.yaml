# Render Blueprint: Qamqor API (server/). DB is Neon (DATABASE_URL set in the Render dashboard).
services:
  - type: web
    name: qamqor-api
    runtime: node
    plan: free
    rootDir: server
    # builds the site SPA first and copies it INSIDE rootDir (server/site-dist): Render ships only rootDir to runtime
    buildCommand: rm -rf site-dist && if [ -f ../site/package.json ]; then (cd ../site && npm ci --include=dev && npm run build) && cp -r ../site/dist site-dist; fi && npm ci --include=dev && npx prisma generate && npm run build
    # free plan has no preDeployCommand, so migrations run at start
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    # rootDir alone only deploys on server/ changes; the site is built into the same service
    buildFilter:
      paths:
        - server/**
        - site/**
        - render.yaml
    envVars:
      - key: SITE_DIST_DIR
        value: site-dist
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: NORMAL_PING_INTERVAL_SEC
        value: "300"
      - key: EMERGENCY_PING_INTERVAL_SEC
        value: "15"
