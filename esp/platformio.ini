; Qamqor collar firmware (ESP32, Arduino framework). Single source: qamqor_collar/qamqor_collar.ino
; Platform 6.9.0 = arduino-esp32 2.0.17 (has the legacy driver/i2s.h API the sketch uses).
[platformio]
src_dir = qamqor_collar

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^7.2.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
