services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: qamqor-postgres
    restart: always
    environment:
      POSTGRES_USER: qamqor
      POSTGRES_PASSWORD: qamqor_secret_2026
      POSTGRES_DB: qamqor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qamqor -d qamqor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

